version: '3'

output: prefixed

vars:
  # Carpeta del Node que pide el .nvmrc (via nvm). Se antepone al PATH en cada comando
  # porque Task no deja pisar el PATH de la terminal desde `env`.
  NODE_BIN:
    sh: bash -c '. "${NVM_DIR:-$HOME/.nvm}/nvm.sh" && dirname "$(nvm which "$(cat .nvmrc)")"'

tasks:
  start:
    desc: Levanta back y front en paralelo
    deps: [start:back, start:front]

  start:back:
    desc: Levanta el backend (node --watch)
    dir: Back-DaiTec_dev
    prefix: back
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm start

  start:front:
    desc: Levanta el frontend (Vite)
    dir: FrontDaiTec_dev
    prefix: front
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm run dev

  install:
    desc: Instala dependencias de ambos repos
    deps: [install:back, install:front]

  install:back:
    dir: Back-DaiTec_dev
    prefix: back
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm install

  install:front:
    dir: FrontDaiTec_dev
    prefix: front
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm install

  check:
    desc: Typecheck + lint (incluye formato) de ambos repos
    deps: [check:back, check:front]

  check:back:
    dir: Back-DaiTec_dev
    prefix: back
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm run typecheck
      - PATH="{{.NODE_BIN}}:$PATH" npm run lint

  check:front:
    dir: FrontDaiTec_dev
    prefix: front
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" npm run typecheck
      - PATH="{{.NODE_BIN}}:$PATH" npm run lint

  node:
    desc: Muestra la versión de Node que usan las tareas
    cmds:
      - PATH="{{.NODE_BIN}}:$PATH" node --version
